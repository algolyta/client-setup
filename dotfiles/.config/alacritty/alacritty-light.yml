# Alacritty light mode config

window:
  opacity: 1.0
  padding:
    x: 8
    y: 8
  decorations: full
  dynamic_padding: true

font:
  normal:
    family: JetBrainsMono Nerd Font
    style: Regular
  bold:
    family: JetBrainsMono Nerd Font
    style: Bold
  italic:
    family: JetBrainsMono Nerd Font
    style: Italic
  size: 12.0

cursor:
  style: Beam
  unfocused_hollow: true

colors:
  primary:
    background: '#FAF8FF'   # Lys nesten-hvit bakgrunn
    foreground: '#4A3C58'   # Mørk lilla tekst
  normal:
    black:   '#4A3C58'
    red:     '#E58D8D'      # Myk rosa-rød
    green:   '#72C29B'      # Pastellgrønn
    yellow:  '#EACB76'      # Lys gul
    blue:    '#7AA7D8'      # Soft blå
    magenta: '#C39BD3'      # Lavendel
    cyan:    '#6EC9D1'      # Turkis
    white:   '#FAF8FF'
  bright:
    black:   '#6E5A82'
    red:     '#F28FAD'
    green:   '#8BE9B6'
    yellow:  '#FFD580'
    blue:    '#96CDFB'
    magenta: '#DDB6F2'
    cyan:    '#89DCEB'
    white:   '#FFFFFF'

selection:
  save_to_clipboard: true

live_config_reload: true

