# =========================
# MONITOR SETUP
# =========================
monitor=,preferred,auto,1

# =========================
# VARIABLES
# =========================
$mod = SUPER

# Apps
$terminal = alacritty
$menu = rofi -show drun
$browser = brave

# =========================
# LOOK & FEEL
# =========================
general {
    gaps_in = 6
    gaps_out = 12
    border_size = 2

    # Purple borders
    col.active_border = rgba(cba6f7ff)
    col.inactive_border = rgba(585b70aa)

    layout = dwindle
}

decoration {
    rounding = 10

    blur {
        enabled = true
        size = 6
        passes = 2
    }
}

animations {
    enabled = yes

    # Smooth animations
    animation = windows, 1, 5, default
    animation = fade, 1, 5, default
    animation = workspaces, 1, 5, default
}

# =========================
# INPUT
# =========================
input {
    kb_layout = us,no
    kb_options = grp:alt_shift_toggle

    follow_mouse = 1

    touchpad {
        natural_scroll = yes
    }

    sensitivity = 0 # -1.0 - 1.0
}


# =========================
# HARDWARE KEYS
# =========================
# Volume up
bind = , XF86AudioRaiseVolume, exec, pamixer -i 5
# Volume down
bind = , XF86AudioLowerVolume, exec, pamixer -d 5
# Mute toggle
bind = , XF86AudioMute, exec, pamixer -t
# Brightness up
bind = , XF86MonBrightnessUp, exec, brightnessctl set +10%
# Brightness down
bind = , XF86MonBrightnessDown, exec, brightnessctl set 10%-
# Screenshot
bind = , Print, exec, grim

# =========================
# KEYBINDINGS
# =========================

# Fullscreen
bind = $mod, F, fullscreen

# Launch apps
bind = $mod, RETURN, exec, $terminal
bind = $mod, D, exec, $menu
bind = $mod, B, exec, $browser

# Kill window
bind = $mod, Q, killactive

# Reload Hyprland config
bind = $mod SHIFT, R, exec, hyprctl reload

# Screenshot
bind = , Print, exec, grim

# Exit Hyprland
bind = $mod SHIFT, E, exit

# Lock screen
#bind = $mod ALT, L, exec, swaylock -i /usr/share/backgrounds/wallpaper.jpg
bind = $mod ALT, L, exec, swaylock -c 000000

# Move focus
bind = $mod, H, movefocus, l
bind = $mod, L, movefocus, r
bind = $mod, K, movefocus, u
bind = $mod, J, movefocus, d

# Workspaces
bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod, 6, workspace, 6
bind = $mod, 7, workspace, 7
bind = $mod, 8, workspace, 8
bind = $mod, 9, workspace, 9

# Move windows to workspace
bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
bind = $mod SHIFT, 5, movetoworkspace, 5
bind = $mod SHIFT, 6, movetoworkspace, 6
bind = $mod SHIFT, 7, movetoworkspace, 7
bind = $mod SHIFT, 8, movetoworkspace, 8
bind = $mod SHIFT, 9, movetoworkspace, 9

# =========================
# MOVE WINDOWS (like i3)
# =========================

# Move active window in direction
bind = $mod SHIFT, H, movewindow, l
bind = $mod SHIFT, L, movewindow, r
bind = $mod SHIFT, K, movewindow, u
bind = $mod SHIFT, J, movewindow, d

# =========================
# AUTOSTART
# =========================
exec-once = waybar
exec-once = swaybg -i /usr/share/backgrounds/wallpaper.jpg
