---
- name: Setup Arch Linux packages and dotfiles
  hosts: localhost
  connection: local
  become: true
  vars_files:
    - vars.yml
  tasks:
    - name: Update pacman packages
      pacman:
        upgrade: yes
        update_cache: yes

    - name: Install pacman packages
      pacman:
        name: "{{ item }}"
        state: present
        update_cache: yes
      loop: "{{ pacman_packages }}"

    - name: Copy dotfiles to target locations
      copy:
        src: "{{ item.src }}"
        dest: "{{ item.dest }}"
        owner: "{{ lookup('ansible.builtin.env', 'SUDO_USER') }}"
        mode: preserve
      loop: "{{ dotfiles }}"
      when: dotfiles | length > 0

    - name: Copy other files to target locations
      copy:
        src: "{{ item.src }}"
        dest: "{{ item.dest }}"
        owner: "{{ lookup('ansible.builtin.env', 'SUDO_USER') }}"
        mode: preserve
      loop: "{{ otherfiles }}"
      when: otherfiles | length > 0

    - name: Load local vars (host-specific window rules)
      ansible.builtin.include_vars:
        file: "{{ lookup('ansible.builtin.first_found', ['local_vars.yml', 'local_vars.yml.default']) }}"
      tags: always

    - name: Template config files with host overrides
      template:
        src: "{{ item.src }}"
        dest: "{{ item.dest }}"
        owner: "{{ lookup('ansible.builtin.env', 'SUDO_USER') }}"
      loop:
        - src: templates/hypr/hyprland.lua.j2
          dest: "{{ lookup('ansible.builtin.env', 'SUDO_HOME') }}/.config/hypr/hyprland.lua"
        - src: templates/waybar/config.j2
          dest: "{{ lookup('ansible.builtin.env', 'SUDO_HOME') }}/.config/waybar/config"

    - name: Disable lightdm
      systemd_service:
        name: "lightdm"
        enabled: false

    - name: Enable greetd
      systemd_service:
        name: "greetd"
        enabled: true

    - name: Change shell to zsh
      tags: zsh
      user:
        user: "{{ lookup('ansible.builtin.env', 'SUDO_USER') }}"
        shell: "/usr/bin/zsh"

    - name: Clone powerlevel10k
      tags: zsh
      ansible.builtin.git:
        repo: 'https://github.com/romkatv/powerlevel10k.git'
        dest: "{{ lookup('ansible.builtin.env', 'SUDO_HOME') }}/.zsh/powerlevel10k"

    - name: Clone zsh-autosuggestions
      tags: zsh
      ansible.builtin.git:
        repo: 'https://github.com/zsh-users/zsh-autosuggestions'
        dest: "{{ lookup('ansible.builtin.env', 'SUDO_HOME') }}/.zsh/zsh-autosuggestions"

    - name: Clone zsh-syntax-highlighting
      tags: zsh
      ansible.builtin.git:
        repo: 'https://github.com/zsh-users/zsh-syntax-highlighting'
        dest: "{{ lookup('ansible.builtin.env', 'SUDO_HOME') }}/.zsh/zsh-syntax-highlighting"
