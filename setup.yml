---
- name: Setup Arch Linux packages and dotfiles
  hosts: localhost
  connection: local
  become: true
  vars:
    pacman_packages:
      - base-devel
      - git
      - vim
      - zsh
    dotfiles:
      # Add dotfile entries here with src/dest pairs.
      # Example:
      # - src: "dotfiles/.bashrc"
      #   dest: "/home/{{ ansible_user_id }}/.bashrc"
  tasks:
    - name: Install pacman packages
      pacman:
        name: "{{ item }}"
        state: present
        update_cache: yes
      loop: "{{ pacman_packages }}"

    - name: Copy dotfiles to target locations
      copy:
        src: "{{ item.src }}"
        dest: "{{ item.dest }}"
        owner: "{{ ansible_user_id }}"
        mode: preserve
      loop: "{{ dotfiles }}"
      when: dotfiles | length > 0
